# set -g prefix ^B
set -s escape-time 0
set -sg repeat-time 0
set -s focus-events on

set -g history-limit 262144

setw -g mouse on
set -g mouse on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string '#T'

unbind -T copy-mode-vi MouseDragEnd1Pane
set -g mode-keys vi

set-option -g default-shell /bin/zsh

set -g renumber-windows on

# set-option -g default-terminal 'screen-256color'
# set-option -g terminal-overrides ',xterm-256color:RGB'
set -g default-terminal "${TERM}" # default terminal emulator to use
set -ga terminal-overrides ',xterm-256color:Tc'

set -g base-index 1
set -g pane-base-index 1

# set -g status-position top
set -g status-position bottom

set-window-option -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "Reloading Tmux... Just a sec!"

bind o run-shell "open #{pane_current_path}"
bind -r e kill-pane -a

# Set easier window split keys
bind -r \\ split-window -h
bind -r - split-window -v

bind -n End send-key C-e
bind -n Home send-key C-a

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# to go next window
# to go previous window
bind -r C-k next-window
bind -r C-j previous-window

# Moving window
bind -r C-h swap-window -t -1 \; previous-window
bind -r C-l swap-window -t +1 \; next-window

# Resizing pane
# bind -r C-Up resize-pane -U 5
# bind -r C-Down resize-pane -D 5
# bind -r C-Left resize-pane -L 5
# bind -r C-Right resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
source-file "$HOME/.tmux-gitbar/tmux-gitbar.tmux"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"

# catppuccin mocha colors
# Some basic mocha colors.
set -g @ctp_bg "#11111b"
set -g @ctp_base "#11111b"
set -g @ctp_surface_0 "#313244"
set -g @ctp_surface_1 "#45475a"
set -g @ctp_fg "#cdd6f4"
set -g @ctp_crust "#11111b"
set -g @ctp_red "#e78284"
set -g @ctp_yellow "#e5c890"
set -g @ctp_mauve "#ca9ee6"
set -g @ctp_lavendar "#babbf1"
set -g @ctp_blue "#8caaee"
set -g @ctp_sapphire "#85c1dc"
set -g @ctp_green "#a6d189"

